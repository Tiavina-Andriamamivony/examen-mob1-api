name: CI Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'file:./dev.db' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET_TEST || 'fallback_value' }}
      PORT: 8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/src/index.js || (echo "Build output missing: dist/src/index.js" && exit 1)
          test -d dist/docs || (echo "Docs folder missing from dist" && exit 1)

      - name: Start server and verify it responds
        run: |
          node -r module-alias/register dist/src/index.js &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"

          # Wait for server to be ready
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/api-docs > /dev/null 2>&1; then
              echo "Server is up!"
              break
            fi
            echo "Waiting for server... ($i/15)"
            sleep 2
          done

          # Assert server is responding
          curl -sf http://localhost:8080/api-docs || (echo "Server did not respond at /api-docs" && kill $SERVER_PID && exit 1)

          kill $SERVER_PID